<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Consultório</title>
<script>
  (function () {
    var savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    var savedPalette = localStorage.getItem('palette');
    if (savedPalette) document.documentElement.setAttribute('data-palette', savedPalette);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #6d5ba8;
    --teal-dark: #5c4c8f;
    --bg: #d9d2e8;
    --bg-grad-start: #ddd6ec;
    --bg-grad-end: #cdc3e0;
    --card: #eee9f6;
    --input-bg: #e4dcf0;
    --input-bg-focus: #f3eefa;
    --text: #363150;
    --muted: #7a7593;
    --border: #c9bfdd;
    --shadow: rgba(70, 54, 110, 0.14);
  }

  :root[data-theme="dark"] {
    --teal: #a78bfa;
    --teal-dark: #c4b5fd;
    --bg: #16131f;
    --bg-grad-start: #130f1a;
    --bg-grad-end: #1d1829;
    --card: #221e30;
    --input-bg: #2a2438;
    --input-bg-focus: #322b44;
    --text: #ece8f7;
    --muted: #a89bc4;
    --border: #362f49;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --teal: #a78bfa;
      --teal-dark: #c4b5fd;
      --bg: #16131f;
      --bg-grad-start: #130f1a;
      --bg-grad-end: #1d1829;
      --card: #221e30;
      --input-bg: #2a2438;
      --input-bg-focus: #322b44;
      --text: #ece8f7;
      --muted: #a89bc4;
      --border: #362f49;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  /* Paleta: Verde-sálvia */
  :root[data-palette="sage"] {
    --teal: #6b8f71;
    --teal-dark: #587a5e;
    --bg: #d7e2da;
    --bg-grad-start: #dbe6de;
    --bg-grad-end: #c9d8cd;
    --card: #eaf2ec;
    --input-bg: #dfeae2;
    --input-bg-focus: #f0f6f1;
    --border: #c3d2c7;
    --shadow: rgba(60, 90, 70, 0.1);
  }

  :root[data-palette="sage"][data-theme="dark"] {
    --teal: #8fb89a;
    --teal-dark: #a9cdb2;
    --bg: #121814;
    --bg-grad-start: #10160f;
    --bg-grad-end: #182018;
    --card: #1c241d;
    --input-bg: #232d24;
    --input-bg-focus: #2a352b;
    --border: #2c3a30;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  @media (prefers-color-scheme: dark) {
    :root[data-palette="sage"]:not([data-theme="light"]) {
      --teal: #8fb89a;
      --teal-dark: #a9cdb2;
      --bg: #121814;
      --bg-grad-start: #10160f;
      --bg-grad-end: #182018;
      --card: #1c241d;
      --input-bg: #232d24;
      --input-bg-focus: #2a352b;
      --border: #2c3a30;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  /* Paleta: Azul-suave */
  :root[data-palette="azul"] {
    --teal: #5c7f9e;
    --teal-dark: #4c6b87;
    --bg: #d6e2ea;
    --bg-grad-start: #dae6ed;
    --bg-grad-end: #c7d8e3;
    --card: #eaf2f7;
    --input-bg: #dfe9ef;
    --input-bg-focus: #f0f6f9;
    --border: #c2d4de;
    --shadow: rgba(50, 75, 100, 0.1);
  }

  :root[data-palette="azul"][data-theme="dark"] {
    --teal: #8fb4d1;
    --teal-dark: #a8c8e0;
    --bg: #10161d;
    --bg-grad-start: #0e131a;
    --bg-grad-end: #161f28;
    --card: #1b232c;
    --input-bg: #212b34;
    --input-bg-focus: #29343e;
    --border: #293846;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  @media (prefers-color-scheme: dark) {
    :root[data-palette="azul"]:not([data-theme="light"]) {
      --teal: #8fb4d1;
      --teal-dark: #a8c8e0;
      --bg: #10161d;
      --bg-grad-start: #0e131a;
      --bg-grad-end: #161f28;
      --card: #1b232c;
      --input-bg: #212b34;
      --input-bg-focus: #29343e;
      --border: #293846;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  /* Paleta: Terracota */
  :root[data-palette="terracota"] {
    --teal: #c1794f;
    --teal-dark: #a6633d;
    --bg: #e9d7c2;
    --bg-grad-start: #ecdcc9;
    --bg-grad-end: #dfc7a9;
    --card: #f5ecdf;
    --input-bg: #f0e2cd;
    --input-bg-focus: #f8f1e4;
    --border: #ddc7a8;
    --shadow: rgba(110, 70, 40, 0.1);
  }

  :root[data-palette="terracota"][data-theme="dark"] {
    --teal: #e0a878;
    --teal-dark: #edc09a;
    --bg: #1c140e;
    --bg-grad-start: #19110c;
    --bg-grad-end: #241a12;
    --card: #251c15;
    --input-bg: #2b2119;
    --input-bg-focus: #33281f;
    --border: #3d2e21;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  @media (prefers-color-scheme: dark) {
    :root[data-palette="terracota"]:not([data-theme="light"]) {
      --teal: #e0a878;
      --teal-dark: #edc09a;
      --bg: #1c140e;
      --bg-grad-start: #19110c;
      --bg-grad-end: #241a12;
      --card: #251c15;
      --input-bg: #2b2119;
      --input-bg-focus: #33281f;
      --border: #3d2e21;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    padding: 24px;
    transition: background 0.2s, color 0.2s;
  }

  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--shadow);
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 10px 30px var(--shadow);
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    transition: background 0.2s;
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .logo-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 26px;
  }

  .logo-name {
    font-weight: 800;
    font-size: 18px;
    color: var(--teal-dark);
    letter-spacing: 0.2px;
  }

  h1 {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 8px;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 32px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
  }

  input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(109, 91, 168, 0.16);
    background: var(--input-bg-focus);
  }

  .field {
    display: flex;
    flex-direction: column;
  }

  button {
    margin-top: 8px;
    background: var(--teal);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  button:hover {
    background: var(--teal-dark);
  }

  button:active {
    transform: scale(0.98);
  }

  .forgot {
    text-align: center;
    margin-top: 20px;
  }

  .forgot a {
    color: var(--teal-dark);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }

  .forgot a:hover {
    text-decoration: underline;
  }

  .palette-switcher {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 8px 10px;
    box-shadow: 0 4px 12px var(--shadow);
  }

  .palette-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
  }

  .palette-dot.active {
    border-color: var(--text);
  }
</style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema">🌙</button>

  <div class="palette-switcher" role="group" aria-label="Selecionar paleta de cores">
    <button class="palette-dot" data-palette="lavanda" style="background:#6d5ba8" title="Lavanda" type="button"></button>
    <button class="palette-dot" data-palette="sage" style="background:#6b8f71" title="Verde-sálvia" type="button"></button>
    <button class="palette-dot" data-palette="azul" style="background:#5c7f9e" title="Azul-suave" type="button"></button>
    <button class="palette-dot" data-palette="terracota" style="background:#c1794f" title="Terracota" type="button"></button>
  </div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">🪻</div>
      <div class="logo-name">Consultório</div>
    </div>

    <h1>Bem-vinda de volta</h1>
    <p class="subtitle">Acesse sua agenda e seus pacientes</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="forgot">
      <a href="#">Esqueci minha senha</a>
    </div>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById('themeToggle');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      function currentTheme() {
        return root.getAttribute('data-theme') || (prefersDark ? 'dark' : 'light');
      }

      function updateIcon() {
        toggle.textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
      }

      toggle.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateIcon();
      });

      updateIcon();

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        window.location.href = 'dashboard.html';
      });

      var paletteDots = document.querySelectorAll('.palette-dot');
      var currentPalette = root.getAttribute('data-palette') || 'lavanda';

      function markActivePalette() {
        paletteDots.forEach(function (dot) {
          dot.classList.toggle('active', dot.dataset.palette === currentPalette);
        });
      }

      paletteDots.forEach(function (dot) {
        dot.addEventListener('click', function () {
          currentPalette = dot.dataset.palette;
          root.setAttribute('data-palette', currentPalette);
          localStorage.setItem('palette', currentPalette);
          markActivePalette();
        });
      });

      markActivePalette();
    })();
  </script>

</body>
</html>
